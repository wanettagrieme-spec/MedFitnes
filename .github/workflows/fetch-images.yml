name: Скачать картинки постов в репозиторий

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python telegram/publisher/fetch_images.py
      - run: |
          git config user.name "medfitnes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/images telegram/schedule/posts.json
          git diff --cached --quiet || (git commit -m "Картинки постов сохранены в репозитории" && git push)
